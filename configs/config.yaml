server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 60s

checker:
  workers: 32
  max_concurrent_checks: 16
  timeout: 15s
  ip_check_url: "https://api.ipify.org"
  health_check_interval: "0s"

singbox:
  binary: "sing-box"
  startup_timeout: 5s
  shutdown_timeout: 3s
  socks_host: "127.0.0.1"

storage:
  path: "./data"

cleanup:
  enabled: true
  interval: 30m
  dead_after: 3

metrics:
  enabled: true
  path: "/metrics"

logging:
  level: "info"
