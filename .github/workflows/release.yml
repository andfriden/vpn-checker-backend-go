name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64

          - goos: linux
            goarch: arm64

          - goos: darwin
            goarch: amd64

          - goos: darwin
            goarch: arm64

          - goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Test
        run: go test ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        shell: bash
        run: |
          mkdir -p dist

          EXT=""
          if [ "$GOOS" = "windows" ]; then
            EXT=".exe"
          fi

          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "dist/vpn-checker-${GOOS}-${GOARCH}${EXT}" \
            ./cmd/server

          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "dist/vpn-checker-collector-${GOOS}-${GOARCH}${EXT}" \
            ./cmd/collector

      - name: Package
        shell: bash
        run: |
          mkdir -p release

          if [ "${{ matrix.goos }}" = "windows" ]; then
            cd dist

            zip \
              "../release/vpn-checker-${{ matrix.goos }}-${{ matrix.goarch }}.zip" \
              "vpn-checker-${{ matrix.goos }}-${{ matrix.goarch }}.exe" \
              "vpn-checker-collector-${{ matrix.goos }}-${{ matrix.goarch }}.exe"
          else
            tar \
              -C dist \
              -czf \
              "release/vpn-checker-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" \
              "vpn-checker-${{ matrix.goos }}-${{ matrix.goarch }}" \
              "vpn-checker-collector-${{ matrix.goos }}-${{ matrix.goarch }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release/*

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create \
            "${GITHUB_REF_NAME}" \
            release/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
